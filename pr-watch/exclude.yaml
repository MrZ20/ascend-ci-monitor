# PR Watch V1: explicit keep rules take precedence over exclusions.
# Unmatched paths are included; do not expand exclusions automatically.
version: 1
keep:
  - .github/**
  - tests/e2e/common/**
  - tests/e2e/doctests/**
  - tests/e2e/nightly/**/scripts/**
  - tests/ut/_tools/**
  - tests/ut/tools/**
exclude:
  - vllm_ascend/**
  - docs/source/tutorials/models/**
  - docs/source/user_guide/feature_guide/**
  - docs/source/user_guide/support_matrix/**
  - tests/SIT/cases/models/**
  - tests/SIT/cases/features/**
  - tests/e2e/pull_request/**
  - tests/e2e/nightly/**
  - tests/ut/**/test_*.py
